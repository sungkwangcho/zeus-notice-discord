name: Zeus Notice Monitor

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-notice:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Run notice checker
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python check_notice.py

      - name: Save last notice
        run: |
          git config user.name "zeus-notice-bot"
          git config user.email "actions@github.com"

          git add last_notice.txt

          if ! git diff --cached --quiet; then
            git commit -m "Update last Zeus notice"
            git push
          else
            echo "변경된 공지 번호 없음"
          fi
